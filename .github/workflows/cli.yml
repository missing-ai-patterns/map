name: CLI

# Typecheck, test, and smoke-test the MAP CLI. Runs on every PR into dev/main so it
# can be a required status check. See .github/BRANCH_PROTECTION.md.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

defaults:
  run:
    working-directory: cli

jobs:
  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (with coverage gate)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Smoke test (map init, built artifact)
        run: |
          node ./dist/map.js --help
          node ./dist/map.js init
          test -f .map/map.config.json
          test -d .map/patterns
          node ./dist/map.js doctor
