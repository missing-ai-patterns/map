name: Reference

# Runs the test suites that ship with reference implementations, so Layer 3 code
# can't rot silently. Conventions: reference/python/**/test_example.py (unittest),
# reference/typescript/**/*.test.ts (node:test, Node-native type stripping).

on:
  pull_request:
    branches: [main, dev]
    paths: ["reference/**", ".github/workflows/reference.yml"]
  push:
    branches: [main, dev]
    paths: ["reference/**", ".github/workflows/reference.yml"]

jobs:
  python:
    name: reference-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest suites next to each example
        run: |
          set -e
          found=0
          for test in $(find reference/python -name 'test_*.py'); do
            found=1
            dir=$(dirname "$test")
            echo "== $dir =="
            (cd "$dir" && python -m unittest -v)
          done
          [ "$found" = "1" ] || echo "no python test suites found"

  typescript:
    name: reference-typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run node:test suites next to each example
        run: |
          set -e
          found=0
          for test in $(find reference/typescript -name '*.test.ts'); do
            found=1
            dir=$(dirname "$test")
            echo "== $dir =="
            (cd "$dir" && node --test "$(basename "$test")")
          done
          [ "$found" = "1" ] || echo "no typescript test suites found"
