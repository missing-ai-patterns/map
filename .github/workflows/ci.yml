name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the pattern registry
        run: node library/scripts/build-registry.ts --check
      - name: Validate MAP schemas and fixtures
        run: node library/scripts/validate-schemas.ts

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tooling/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke-test the built CLI
        run: |
          node packages/cli/dist/map.js --help
          node packages/cli/dist/map.js init
          test -f .map/map.config.json
          node packages/cli/dist/map.js add retrieval/chunking
          test -f .map/patterns/retrieval/chunking/prompt.md
          node packages/cli/dist/map.js doctor
