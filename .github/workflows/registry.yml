name: Registry

# Validates that the pattern registry builds from the repository content
# (ROADMAP.md + patterns/**/pattern.yaml). This is the content equivalent of a
# typecheck: a broken roadmap entry, an invalid MAP Score, or a dangling
# `related:` id fails the PR here instead of inside a consumer (CLI, website).
# See docs/specs/registry.md. Intended as a required status check.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  registry:
    name: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate registry
        run: node scripts/build-registry.ts --check

      - name: Build registry artifact
        run: node scripts/build-registry.ts --out dist/registry.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry
          path: dist/registry.json
